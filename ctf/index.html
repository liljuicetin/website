<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Phase 1</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b12;
      --text: #eefaff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      user-select: none;
    }

    main {
      width: min(1100px, 100%);
      text-align: center;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(2rem, 6vw, 4rem);
      letter-spacing: .04em;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 78vh;
      object-fit: contain;
      margin: 0 auto;
      -webkit-user-drag: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Phase 1</h1>
    <img id="challenge" alt="" draggable="false" />
  </main>

  <script>
    fetch("Phase2.jpg")
      .then(response => response.blob())
      .then(blob => {
        document.getElementById("challenge").src = URL.createObjectURL(blob);
      });

    document.addEventListener("contextmenu", event => event.preventDefault());
    document.addEventListener("dragstart", event => event.preventDefault());
  </script>
</body>
</html>
